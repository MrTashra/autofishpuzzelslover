name: build from zip

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: Extract Project Zip
        run: |
          # پیدا کردن فایل زیپ و استخراج آن در پوشه اصلی
          unzip project.zip -d extracted_project
          # انتقال محتویات به پوشه ریشه گیت‌هاب
          cp -r extracted_project/* ./

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Headless Display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip

      - name: build with virtual display
        run: xvfb-run --auto-servernum ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
